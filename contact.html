<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Leamington Kinsmen – Contact</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <nav class="top-nav">
        <div class="nav-container">
    <div class="logo-small">
        <img src="kincanada.png" alt="Kinsmen Logo">
    </div>
    <button class="burger-menu" type="button" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Heritage</a></li>
        <li><a href="#">Events</a></li>
        <li><a href="#">Member Resources</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</div>
    </nav>

    <header class="main-header">
        <div class="header-wrapper">
            <div class="logo-large">
                <img src="kincanada.png" alt="Kinsmen Canada Logo">
            </div>
        <div class="header-text-container">
                <div class="header-text">
                    <h1>Leamington <span class="highlight">Kinsmen</span></h1>
                    <p class="tagline">Serving The Community's Greatest Need</p>
                </div>
            </div>
        </div>
    </header>

    <div class="page-title">
        <h2><span class="highlight">Contact</span> Us</h2>
    </div>

    <main class="contact-main">
        <section class="contact-form">
            <div class="field">
                <label>Name</label>
                <input type="text" placeholder="John Doe">
            </div>
            <div class="field">
                <label>Email</label>
                <input type="email" placeholder="johndoe@gmail.com">
            </div>
            <div class="field">
                <label>Subject</label>
                <input type="text" placeholder="What is the subject of your message?">
            </div>
            <div class="field">
                <label>Message</label>
                <textarea placeholder="Write your message here."></textarea>
            </div>
            <button class="button-submit" type="button">Submit</button>
        </section>

        <section class="contact-info">
            <address>
                The Kinsmen Club of Leamington<br>
                c/o Reid Funeral Home<br>
                14 Russell Street<br>
                Leamington, ON N8H 1T8
            </address>
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2956.6!2d-82.5962!3d42.0534!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x883a2b1b2b2b2b2b%3A0x0!2s14+Russell+St%2C+Leamington%2C+ON+N8H+1T8!5e0!3m2!1sen!2sca!4v1680000000000"
                allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"
                title="Leamington Kinsmen location">
            </iframe>
        </section>
    </main>

    <footer class="main-footer">
    <div class="footer-inner">
        <div class="footer-brand">
            <img src="kincanada.png" alt="Kinsmen Logo">
            <span class="footer-kinsmen">Leamington Kinsmen</span>
        </div>
        <div class="footer-links">
            <a href="#">Top of Page</a>
            <a href="#">Home</a>
            <a href="#">Kin Canada</a>
        </div>
    </div>
</footer>
    <script src="js/contact.js"></script>
    </body>
</html>
